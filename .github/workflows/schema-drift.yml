name: Schema drift

# Fails when the published OpenAPI schema no longer matches the vendored copy.
# Fix it with `just schema-pull`, then update the client to match.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just schema-diff
