name: Release

# Merging a release/vX.Y.Z PR (opened by `just release`) builds that commit, publishes it to PyPI
# through trusted publishing, then tags it vX.Y.Z and creates the GitHub Release from its
# CHANGELOG.md section. Nothing publishes from a developer's machine.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${BRANCH#release/v}"
          test "$(uv version --short)" = "$version"
          python3 tools/release.py --notes "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yama-client/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python3 tools/release.py --notes "$VERSION" > notes.md
          gh release create "v$VERSION" dist/* --target "$SHA" --title "$VERSION" --notes-file notes.md
