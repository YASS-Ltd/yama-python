name: Docs

# Builds the docs site on every pull request and push to `main`. Publishes to GitHub Pages when
# run by hand (from `main`) and after each successful Release run (from the release's tag, so
# the site can't show what isn't on PyPI yet). `workflow_run` runs on `main`, which the
# github-pages environment requires; the Release run's own pull-request ref isn't allowed to.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: ['release/v*']

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'workflow_run'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="v${BRANCH#release/v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          git checkout "$tag"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just docs-build
      - if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    concurrency:
      group: pages
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
