name: Bug report
description: Something in the client doesn't work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: |
        What you did, what you expected, and what happened instead. Short code and the error message help most.
        **Never paste an API key or customer data.** Redact keys, phone numbers and names.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: yama-client 0.1.0, Python 3.13
