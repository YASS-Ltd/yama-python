                $ref: '#/components/schemas/Error'
        '429':
          description: 'Rate limited: retry after the `Retry-After` header''s seconds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-api-key-permission: contacts:read
  /api/v2/contacts/{uuid}/:
    get:
      operationId: contacts_retrieve
      description: |-
        Get one contact by its `uuid`.

        Requires the API key permission Contacts: Read.
      summary: Get a contact
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          format: uuid
        required: true
      tags:
