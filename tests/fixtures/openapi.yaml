    code: Visitor Code 5678 2026-10-03T22:06:26.908021Z
    created: {'uuid': '1954b376-dceb-4f8e-9411-1c4853df4a21', 'unit': 'dd1053d5-0a4b-4c0d-a619-6a1457d97de6', 'code': '482915', 'name': 'Dog walker', 'expires_at': '2026-11-01T00:00:00Z'}
    changed: {'uuid': '1954b376-dceb-4f8e-9411-1c4853df4a21', 'unit': 'dd1053d5-0a4b-4c0d-a619-6a1457d97de6', 'code': '482915', 'name': 'Dog walker', 'expires_at': '2026-11-15T00:00:00Z'}
    cleared: {'uuid': '1954b376-dceb-4f8e-9411-1c4853df4a21', 'unit': 'dd1053d5-0a4b-4c0d-a619-6a1457d97de6', 'code': '482915', 'name': 'Dog walker', 'expires_at': None}
