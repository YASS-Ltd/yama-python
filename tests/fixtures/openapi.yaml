    call: 2026-10-10T22:09:08.902359Z E191C4 code_accepted Primary Code · Accepted
    ```

    The dates in these examples were in the future when they ran; pick your own when you try them.

    ## 5. Keeping your key safe

    - Treat the key like a password. Keep it in a secret store and out of source control, logs and URLs.
    - If a key leaks, delete it in **Settings › API keys** at once (it stops working on the next request), or ask Yama support to revoke it.
    - "Last used" in Settings is accurate to about 5 minutes; use it to spot keys nobody uses any more, and delete them.
