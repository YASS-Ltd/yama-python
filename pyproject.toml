[project]
name = "yama"
version = "0.0.0"
description = "The official Python client for the Yama access-control API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yama Access Software Systems Ltd." }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]
keywords = ["yama", "access control", "intercom", "api", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://yamasystems.com"
Documentation = "https://app.yamasystems.com/api/v2/docs/"
Source = "https://github.com/YASS-Ltd/yama-python"
Issues = "https://github.com/YASS-Ltd/yama-python/issues"
Changelog = "https://github.com/YASS-Ltd/yama-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "openapi-schema-validator>=0.9.0",
    "pytest>=8",
    "pytest-cov>=6",
    "pyyaml>=6.0.3",
    "respx>=0.22",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["yama"]
branch = true
